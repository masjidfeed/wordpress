name: Task
description: Create a new task for an actionable item
title: "[Task] <title>"
type: "Task"
body:
  - type: markdown
    attributes:
      value: |
        ## Task Details
        Describe the specific work to be done. Tasks can be linked to epics or user stories for context.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
      placeholder: Describe the task.
    validations:
      required: true
